[build-system]
requires = ["setuptools>=80,<82", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "business-change-impact-agent"
version = "0.1.0"
description = "Evidence-grounded direct and indirect business change impact analysis with human confirmation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Mounir Dameur" }]
keywords = [
  "business-analysis",
  "change-impact",
  "traceability",
  "graph",
  "human-in-the-loop",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.48,<2"]
dev = [
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "detect-secrets>=1.5,<2",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "twine>=6.1,<7",
]

[project.scripts]
business-change-impact-agent = "business_change_impact_agent.cli:main"

[project.urls]
Homepage = "https://github.com/DameurMounir/business-change-impact-agent"
Repository = "https://github.com/DameurMounir/business-change-impact-agent"
Issues = "https://github.com/DameurMounir/business-change-impact-agent/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
business_change_impact_agent = ["py.typed", "sample_case/**/*.json", "rules/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_case.py" = ["C901"]
"scripts/generate_public_artifacts.py" = ["C901"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
mypy_path = "src"
exclude = ["build", "dist"]

[[tool.mypy.overrides]]
module = "streamlit.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=business_change_impact_agent --cov-branch --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["business_change_impact_agent"]
omit = ["src/business_change_impact_agent/ui.py", "src/business_change_impact_agent/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests", "evaluation", ".venv"]
skips = ["B101"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
